<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plans — Application Cartographique</title>
    <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        /* ---------------------------------------------------------------
           RÉINITIALISATION & VARIABLES (Look Plans d'Apple)
           --------------------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --bg-panel: rgba(255, 255, 255, 0.72);
            --border-panel: rgba(0, 0, 0, 0.06);
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --shadow-panel: 0 8px 32px rgba(0, 0, 0, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background: #f2f2f7;
            color: var(--text-primary);
        }

        /* ---------------------------------------------------------------
           CARTE
           --------------------------------------------------------------- */
        #map {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* ---------------------------------------------------------------
           PANNEAU DE CONTRÔLE (Le "Material Blur" d'Apple)
           --------------------------------------------------------------- */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 320px;
            max-width: calc(100vw - 40px);
            background: var(--bg-panel);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-panel);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-panel);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .control-panel h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-panel h1 span {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.04);
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.06);
            font-size: 15px;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
        }

        .input-group input::placeholder {
            color: #c7c7cc;
        }

        /* ---------------------------------------------------------------
           BOUTONS
           --------------------------------------------------------------- */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
:            padding: 12px 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor pointer;
            transition: transform 0.12s ease, opacity 0.2s ease, background 0.2s ease;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        /* ---------------------------------------------------------------
           BADGES / STATUTS
           --------------------------------------------------------------- */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            min-height: 42px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .status-dot.loading {
            background: #ff9500;
            animation: pulse 1s infinite;
        }

        .status-dot.error {
            background: #ff3b30;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ---------------------------------------------------------------
           MARQUEURS PERSONNALISÉS (Look pin Apple)
           --------------------------------------------------------------- */
        .apple-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .apple-marker:hover {
            transform: scale(1.15);
        }

        .apple-marker.destination {
            background: #ff3b30;
        }

        /* ---------------------------------------------------------------
           ATTRIBUTION CARTE (Obligatoire)
           --------------------------------------------------------------- */
        .maplibregl-ctrl-attrib {
            background: transparent !important;
            font-size: 10px !important;
            color: var(--text-secondary) !important;
            opacity: 0.7;
        }

        .maplibregl-ctrl-attrib a {
            color: var(--text-secondary) !important;
        }

        /* ---------------------------------------------------------------
           RESPONSIVE (Mobile)
           --------------------------------------------------------------- */
        @media (max-width: 500px) {
            .control-panel {
                top: auto;
                bottom: 20px;
                left: 10px;
                right: 10px;
                width: auto;
                max-width: none;
                padding: 16px;
                border-radius: 18px;
            }

            .control-panel h1 {
                font-size: 18px;
            }

            button {
                font-size: 14px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <!-- Panneau de contrôle flottant -->
    <div class="control-panel">
        <h1>
            Plans
            <span>Web</span>
        </h1>

        <div class="input-group">
            <label for="origin">Départ</label>
            <input type="text" id="origin" placeholder="Ex: Tour Eiffel, Paris" value="Tour Eiffel, Paris">
        </div>

        <div class="input-group">
            <label for="destination">Arrivée</label>
            <input type="text" id="destination" placeholder="Ex: Louvre, Paris" value="Louvre, Paris">
        </div>

        <div class="btn-group">
            <button class="btn-secondary" id="clearBtn">Effacer</button>
            <button class="btn-primary" id="routeBtn">Itinéraire</button>
        </div>

        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Prêt</span>
        </div>
    </div>

    <!-- Chargement de MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

    <script>
        // =========================================================================
        // CONFIGURATION
        // =========================================================================

        // ⚠️ IMPORTANT : Remplace ceci par ta clé API OpenRouteService (gratuite)
        // Obtiens-la ici : https://openrouteservice.org/dev/#/signup
        const ORS_API_KEY = 'TA_CLE_API_ICI';

        // URL de base pour le géocodage (recherche d'adresse) via Nominatim
        const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';

        // =========================================================================
        // INITIALISATION DE LA CARTE (Style Positron = épuré, gris clair)
        // =========================================================================

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            center: [2.2945, 48.8584], // Tour Eiffel
            zoom: 13,
            pitch: 0,
            bearing: 0,
            attributionControl: false
        });

        // Ajout de l'attribution manuelle (requise par Carto/OSM)
        map.addControl(new maplibregl.AttributionControl({
            compact: true,
            customAttribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, © <a href="https://carto.com/">CARTO</a>'
        }), 'bottom-right');

        // Désactiver le zoom par défaut pour un look plus épuré
        map.scrollZoom.disable();
        map.doubleClickZoom.disable();

        // Réactiver le zoom avec les boutons (optionnel)
        map.addControl(new maplibregl.NavigationControl({
            showCompass: false,
            showZoom: true,
            visualizePitch: false
        }), 'top-right');

        // =========================================================================
        // VARIABLES GLOBALES
        // =========================================================================

        let originMarker = null;
        let destinationMarker = null;
        let routeSourceId = 'route-line';
        let routeLayerId = 'route-layer';

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // =========================================================================
        // FONCTIONS UTILITAIRES
        // =========================================================================

        /**
         * Met à jour l'état visuel du statut
         */
        function setStatus(message, type = 'ready') {
            statusText.textContent = message;
            statusDot.className = 'status-dot';
            if (type === 'loading') statusDot.classList.add('loading');
            if (type === 'error') statusDot.classList.add('error');
        }

        /**
         * Géocode une adresse via Nominatim (OpenStreetMap)
         * Retourne { lng, lat } ou null
         */
        async function geocodeAddress(address) {
            const url = `${NOMINATIM_URL}?q=${encodeURIComponent(address)}&format=json&limit=1`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'User-Agent': 'PlansWebApp/1.0' // Requis par la politique OSM
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const data = await response.json();

                if (!data || data.length === 0) {
                    return null;
                }

                return {
                    lng: parseFloat(data[0].lon),
                    lat: parseFloat(data[0].lat),
                    name: data[0].display_name
                };
            } catch (error) {
                console.error('Erreur de géocodage:', error);
                return null;
            }
        }

        /**
         * Ajoute ou met à jour un marqueur personnalisé
         */
        function setMarker(lngLat, type = 'origin') {
            // Supprimer l'ancien marqueur du même type
            if (type === 'origin' && originMarker) {
                originMarker.remove();
            }
            if (type === 'destination' && destinationMarker) {
                destinationMarker.remove();
            }

            // Créer un élément HTML personnalisé pour le marqueur
            const el = document.createElement('div');
            el.className = `apple-marker ${type === 'destination' ? 'destination' : ''}`;

            const marker = new maplibregl.Marker({
                element: el,
                anchor: 'center'
            })
            .setLngLat([lngLat.lng, lngLat.lat])
            .addTo(map);

            // Stocker la référence
            if (type === 'origin') originMarker = marker;
            else destinationMarker = marker;

            return marker;
        }

        /**
         * Supprime tous les marqueurs et itinéraires
         */
        function clearAll() {
            if (originMarker) { originMarker.remove(); originMarker = null; }
            if (destinationMarker) { destinationMarker.remove(); destinationMarker = null; }

            if (map.getLayer(routeLayerId)) map.removeLayer(routeLayerId);
            if (map.getSource(routeSourceId)) map.removeSource(routeSourceId);

            setStatus('Effacé', 'ready');
        }

        // =========================================================================
        // LOGIQUE D'ITINÉRAIRE (OpenRouteService)
        // =========================================================================

        async function calculateRoute() {
            const originAddress = document.getElementById('origin').value.trim();
            const destAddress = document.getElementById('destination').value.trim();

            if (!originAddress || !destAddress) {
                setStatus('Veuillez remplir les deux champs', 'error');
                return;
            }

            if (ORS_API_KEY === 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjU3N2I1YjI1MzFjNTQ3NzRiYmNlNjk0YTllMGMzZTM5IiwiaCI6Im11cm11cjY0In0=') {
                setStatus('Ajoute ta clé API ORS dans le code', 'error');
                return;
            }

            setStatus('Géocodage en cours...', 'loading');

            // 1. Géocoder les deux adresses
            const [originCoords, destCoords] = await Promise.all([
                geocodeAddress(originAddress),
                geocodeAddress(destAddress)
            ]);

            if (!originCoords) {
                setStatus(`Adresse de départ introuvable: "${originAddress}"`, 'error');
                return;
            }
            if (!destCoords) {
                setStatus(`Adresse d'arrivée introuvable: "${destAddress}"`, 'error');
                return;
            }

            // 2. Placer les marqueurs
            setMarker(originCoords, 'origin');
            setMarker(destCoords, 'destination');

            setStatus('Calcul de l\'itinéraire...', 'loading');

            // 3. Appel à l'API OpenRouteService
            try {
                const response = await fetch(
                    'https://api.openrouteservice.org/v2/directions/driving-car/geojson',
                    {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json, application/geo+json',
                            'Authorization': ORS_API_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            coordinates: [
                                [originCoords.lng, originCoords.lat],
                                [destCoords.lng, destCoords.lat]
                            ],
                            language: 'fr'
                        })
                    }
                );

                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('Clé API invalide ou expirée');
                    }
                    throw new Error(`Erreur API: ${response.status}`);
                }

                const data = await response.json();

                // 4. Extraire la géométrie de l'itinéraire
                if (!data.features || data.features.length === 0) {
                    throw new Error('Aucun itinéraire trouvé');
                }

                const routeGeometry = data.features[0].geometry;
                const routeProperties = data.features[0].properties;

                // 5. Nettoyer l'ancien itinéraire
                if (map.getLayer(routeLayerId)) map.removeLayer(routeLayerId);
                if (map.getSource(routeSourceId)) map.removeSource(routeSourceId);

                // 6. Ajouter le nouveau calque d'itinéraire
                map.addSource(routeSourceId, {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        geometry: routeGeometry,
                        properties: {}
                    }
                });

                map.addLayer({
                    id: routeLayerId,
                    type: 'line',
                    source: routeSourceId,
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': '#007aff',
                        'line-width': 5,
                        'line-opacity': 0.9
                    }
                });

                // 7. Ajuster la vue pour montrer tout l'itinéraire
                const coordinates = routeGeometry.coordinates;
                const bounds = coordinates.reduce((bounds, coord) => {
                    return bounds.extend(coord);
                }, new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));

                map.fitBounds(bounds, {
                    padding: { top: 80, bottom: 80, left: 380, right: 80 },
                    duration: 1000
                });

                // 8. Afficher les infos de l'itinéraire
                const distanceKm = (routeProperties.summary.distance / 1000).toFixed(1);
                const durationMin = Math.round(routeProperties.summary.duration / 60);
                setStatus(`${distanceKm} km · ${durationMin} min`, 'ready');

            } catch (error) {
                console.error('Erreur d\'itinéraire:', error);
                setStatus(`Erreur: ${error.message}`, 'error');
            }
        }

        // =========================================================================
        // ÉVÉNEMENTS
        // =========================================================================

        document.getElementById('routeBtn').addEventListener('click', calculateRoute);
        document.getElementById('clearBtn').addEventListener('click', clearAll);

        // Permettre le calcul avec la touche Entrée
        document.getElementById('destination').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') calculateRoute();
        });

        // Géolocalisation au démarrage (optionnel)
        map.on('load', () => {
            // Centrer sur la France si aucune action
            setStatus('Prêt', 'ready');
        });

        // =========================================================================
        // GESTION DES ERREURS GLOBALES
        // =========================================================================

        window.addEventListener('error', (e) => {
            console.error('Erreur globale:', e.error);
        });

        window.addEventListener('unhandledrejection', (e) => {
            console.error('Promesse rejetée:', e.reason);
        });
    </script>
</body>
</html>
